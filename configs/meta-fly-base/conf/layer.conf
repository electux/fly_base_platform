# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-fly-base"
BBFILE_PATTERN_meta-fly-base = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-fly-base = "11"

LAYERDEPENDS_meta-fly-base = "core sunxi"
LAYERSERIES_COMPAT_meta-fly-base = "scarthgap"
