#@TYPE: Machine
#@NAME: fly-h3
#@DESCRIPTION: Machine configuration for the Mellow Fly-Pi-lite2.1 (Fly H3), based on Allwinner H3 (sun8i)

require conf/machine/include/sun8i.inc

# Custom Device Tree for Mellow Fly-Pi-lite2.1 (Allwinner H3, 512MB DDR3, RTL8189FTV Wi-Fi)
KERNEL_DEVICETREE = "allwinner/sun8i-h3-fly-h3.dtb"

# Mainline U-Boot baseline matching Allwinner H3 + 512MB DDR3 + UART0 + SD + SDIO Wi-Fi
UBOOT_MACHINE = "orangepi_lite_defconfig"

# Onboard 2.4GHz Wi-Fi (RTL8189FTV over SDIO mmc1)
MACHINE_FEATURES:append = " wifi"
